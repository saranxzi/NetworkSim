[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "networksim-cli"
version = "0.1.0"
description = "CLI runner for NetworkSim architecture-as-test"
requires-python = ">=3.11"
dependencies = [
    "networksim-core>=0.1.0",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "simpleeval>=1.0",
]

[project.scripts]
networksim = "networksim_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/networksim_cli"]
