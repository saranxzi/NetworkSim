[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "networksim-core"
version = "0.3.0"
description = "High-performance distributed systems simulation engine"
requires-python = ">=3.11"
dependencies = [
    "python-igraph>=0.11",
    "pydantic>=2.6",
    "orjson>=3.9",
]

[project.optional-dependencies]
invariants = ["simpleeval>=1.0", "pyyaml>=6.0"]
plugins = ["RestrictedPython>=7.0"]
finops = ["httpx>=0.27"]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "simpleeval>=1.0", "pyyaml>=6.0", "RestrictedPython>=7.0"]
all = ["simpleeval>=1.0", "pyyaml>=6.0", "RestrictedPython>=7.0", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/networksim"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
